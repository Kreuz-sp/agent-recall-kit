[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-recall-kit"
version = "0.1.0"
description = "Local, traceable memory service: source-of-truth library, graph navigation, review workflow, MCP bridge."
readme = "README.md"
requires-python = ">=3.12"
# 实测环境：Windows 11 + Python 3.12.10 / 3.13.15（见 docs/LIMITS.md §8）。
authors = [{name = "Kreuz-sp"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["memory", "knowledge-graph", "local-first", "mcp"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
agent-recall-kit = "she_memory.cli:main"
agent-recall-kit-ctl = "she_memory.tools.memctl:main"
agent-recall-kit-doctor = "she_memory.tools.doctor:main"
agent-recall-kit-backup = "she_memory.tools.backup:main"
agent-recall-kit-mcp = "she_memory.tools.mcp_stdio:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
she_memory = [
  "web/*.js", "web/*.html", "web/*.css",
  "data/*.json",
  "data/demo-library/*.md", "data/demo-library/*.yaml", "data/demo-library/*.json",
  "data/demo-library/*/*.md", "data/demo-library/*/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
